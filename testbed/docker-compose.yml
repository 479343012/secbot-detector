name: secbot-testbed

networks:
  target-net:
    driver: bridge # 独立网桥，与检测服务隔离

services:
  # ── 靶站 1：DVWA（SQLi / XSS / 弱口令）────────────────
  dvwa:
    image: vulnerables/web-dvwa
    container_name: tb-dvwa
    ports:
      - "127.0.0.1:8081:80" # 只绑本机回环
    networks: [ target-net ]

  # ── 靶站 2：低版本 WordPress + 旧插件 ────────────────
  wp-db:
    image: mysql:5.7
    container_name: tb-wp-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wp
      MYSQL_PASSWORD: wppass123
    networks: [ target-net ]

  wordpress:
    image: wordpress:5.2-php7.2-apache
    container_name: tb-wordpress
    ports:
      - "127.0.0.1:8082:80"
    environment:
      WORDPRESS_DB_HOST: wp-db:3306
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wppass123
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - ./wordpress/plugins:/var/www/html/wp-content/plugins # 旧插件挂进去
    depends_on: [ wp-db ]
    networks: [ target-net ]

  # ── 靶站 3：挂马模拟页 ────────────────────────────────
  malware-page:
    build: ./malware-page
    container_name: tb-malware
    ports:
      - "127.0.0.1:8083:80"
    networks: [ target-net ]

  # ── 靶站 4：篡改模拟页 ────────────────────────────────
  tamper-page:
    build: ./tamper-page
    container_name: tb-tamper
    ports:
      - "127.0.0.1:8084:80"
    networks: [ target-net ]

  # ── 靶站 5：备份/敏感文件暴露 ─────────────────────────
  backup-files:
    build: ./backup-files
    container_name: tb-backup
    ports:
      - "127.0.0.1:8085:80"
    networks: [ target-net ]

  # ── 对照组：正常页面（验证不误报）─────────────────────
  normal-page:
    build: ./normal-page
    container_name: tb-normal
    ports:
      - "127.0.0.1:8086:80"
    networks: [ target-net ]

  https-page:
    image: nginx:alpine
    container_name: tb-https
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./normal/html:/usr/share/nginx/html:ro
      - ./normal/headers.conf:/etc/nginx/conf.d/headers.conf:ro
    networks:
      - target-net
    restart: unless-stopped
